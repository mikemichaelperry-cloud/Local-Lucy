      needs_synthesis: false
      clarify_required: false
      evidence_mode: ""
      evidence_reason: ""
      augmentation_recommended: true
      force_local: false
      manifest_version: ""
      selected_route: ""
      allowed_routes: []
      forbidden_routes: []
      raw_plan: {}
    expected_route: NEWS
    allowed_capabilities: [network]

  - id: software_memory_not_medical
    description: Software memory terms must not route medical EVIDENCE
