scenarios:
  - id: forced_local
    description: Classification with force_local=True must route LOCAL
    query: "What is 2 + 2?"
    classification:
      intent: "math"
      intent_family: "local_answer"
      intent_class: "math"
      category: "procedural"
      confidence: 0.95
      needs_web: false
      needs_memory: false
      needs_synthesis: false
      clarify_required: false
      evidence_mode: ""
      evidence_reason: ""
      augmentation_recommended: false
      force_local: true
      manifest_version: ""
      selected_route: ""
      allowed_routes: []
      forbidden_routes: []
      raw_plan: {}
    expected_route: LOCAL
    forbidden_capabilities: [network]

  - id: medical_evidence
    description: Medical evidence mode must route EVIDENCE
    query: "I have chest pain and shortness of breath"
    classification:
      intent: "medical_info"
      intent_family: "current_evidence"
      intent_class: "medical_query"
      category: "medical"
      confidence: 0.85
      needs_web: true
      needs_memory: false
      needs_synthesis: false
      clarify_required: false
      evidence_mode: "required"
      evidence_reason: "medical_context"
      augmentation_recommended: false
      force_local: false
      manifest_version: ""
      selected_route: ""
      allowed_routes: []
      forbidden_routes: []
      raw_plan: {}
    expected_route: EVIDENCE
    required_evidence_mode: required
    allowed_capabilities: [network]

  - id: clear_news
    description: Clear news phrasing must route NEWS
    query: "Show me today's top news headlines"
    classification:
      intent: "news_query"
      intent_family: "current_evidence"
      intent_class: "news_query"
      category: "news_world"
